<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Vibe Coding Repository Standard</title>
  <desc id="desc">Build fast with AI while keeping the repository understandable through evidence, safe changes, and independent review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f20"/>
      <stop offset="0.58" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1160" cy="70" r="260" fill="#7c3aed" opacity="0.16"/>
  <circle cx="1070" cy="610" r="285" fill="#06b6d4" opacity="0.14"/>
  <circle cx="115" cy="640" r="215" fill="#3b82f6" opacity="0.16"/>

  <g transform="translate(72 72)">
    <rect width="118" height="118" rx="28" fill="#0b1020" stroke="url(#accent)" stroke-width="5"/>
    <rect x="26" y="28" width="68" height="61" rx="10" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <path d="M26 46h68" stroke="url(#accent)" stroke-width="6"/>
    <path d="M43 69l11 11 26-29" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="72" y="276" fill="#f8fafc" font-size="58" font-weight="750">Vibe Coding</text>
    <text x="72" y="347" fill="#f8fafc" font-size="58" font-weight="750">Repository Standard</text>
    <text x="72" y="423" fill="#cbd5e1" font-size="29">Build fast with AI.</text>
    <text x="72" y="464" fill="#cbd5e1" font-size="29">Keep the repository understandable.</text>
    <text x="72" y="521" fill="#94a3b8" font-size="19">Open source · Codex-first · Agent-ready</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(840 86)">
      <rect width="366" height="112" rx="22" fill="#f8fafc"/>
      <circle cx="50" cy="56" r="25" fill="#7c3aed"/>
      <text x="50" y="64" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text>
      <text x="92" y="48" fill="#0f172a" font-size="23" font-weight="750">Understand first</text>
      <text x="92" y="79" fill="#475569" font-size="16">Trace code, callers, and evidence</text>
    </g>
    <g transform="translate(875 264)">
      <rect width="366" height="112" rx="22" fill="#f8fafc"/>
      <circle cx="50" cy="56" r="25" fill="#2563eb"/>
      <text x="50" y="64" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="92" y="48" fill="#0f172a" font-size="23" font-weight="750">Change safely</text>
      <text x="92" y="79" fill="#475569" font-size="16">Bounded scope and visible tests</text>
    </g>
    <g transform="translate(840 442)">
      <rect width="366" height="112" rx="22" fill="#f8fafc"/>
      <circle cx="50" cy="56" r="25" fill="#0f766e"/>
      <text x="50" y="64" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="92" y="48" fill="#0f172a" font-size="23" font-weight="750">Review independently</text>
      <text x="92" y="79" fill="#475569" font-size="16">Evidence before approval</text>
    </g>
  </g>
  <path d="M1023 198v66M1058 376v66" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 11"/>
</svg>
